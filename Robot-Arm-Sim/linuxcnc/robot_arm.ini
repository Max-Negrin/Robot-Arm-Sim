# =============================================================================
# robot_arm.ini  —  LinuxCNC machine config for 5-axis serial robot arm
# =============================================================================

[EMC]
MACHINE = Robot Arm
VERSION = 1.1
DEBUG   = 0


[DISPLAY]
DISPLAY          = axis
POSITION_OFFSET  = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.5
MAX_SPINDLE_OVERRIDE = 1.0
PROGRAM_PREFIX   = ~/linuxcnc/nc_files
INTRO_GRAPHIC    = linuxcnc.gif
INTRO_TIME       = 2
CYCLE_TIME       = 0.100
DEFAULT_ANGULAR_VELOCITY    = 10.0
MAX_ANGULAR_VELOCITY        = 43.0


[FILTER]
PROGRAM_EXTENSION = .ngc,.nc G-Code


[TASK]
TASK      = milltask
CYCLE_TIME = 0.010


[RS274NGC]
PARAMETER_FILE = robot_arm.var


[EMCMOT]
EMCMOT            = motmod
COMM_TIMEOUT       = 1.0
BASE_PERIOD        = 100000     # 0.1 ms — only needed if using RT stepgen
SERVO_PERIOD       = 1000000    # 1 ms servo loop (1 kHz)


[PICO]
USB_PORT = /dev/ttyACM0
# For WiFi instead of USB, leave USB_PORT empty and set:
# WIFI_HOST = 192.168.x.x
# WIFI_PORT = 8888


[KINS]
KINEMATICS = genserkins
JOINTS     = 5

# DH parameters — match the arm_config.json link geometry.
# a     link lengths along x  (mm or same unit as UNITS below)
# alpha twist angle (rad) between successive z-axes
# d     offset along z
# theta constant angle offset (joint home offsets handled via HOME_OFFSET)
[GENSERKINS]
A_0     = 0.0
A_1     = 8.0
A_2     = 3.4
A_3     = 4.0
A_4     = 7.0
ALPHA_0 =  1.5707963   #  90° — transitions base yaw into the arm's vertical plane
ALPHA_1 =  0.0
ALPHA_2 =  0.0
ALPHA_3 =  1.5707963   #  90° — wrist roll joint
ALPHA_4 =  0.0
D_0     = 3.0           # base_vertical_offset from arm_config.json
D_1     = 0.0
D_2     = 0.0
D_3     = 0.0
D_4     = 0.0
# EE link length 2.5 — set as tool length offset in TOOL_TABLE, not DH.


[TRAJ]
COORDINATES        = A B C D E      # 5 rotary joints (no linear axes)
ANGULAR_UNITS      = degree
DEFAULT_ANGULAR_VELOCITY   = 10.0
MAX_ANGULAR_VELOCITY       = 43.0
DEFAULT_ANGULAR_ACCELERATION = 40.0
MAX_ANGULAR_ACCELERATION     = 87.0


[EMCIO]
EMCIO         = io
CYCLE_TIME    = 0.100
TOOL_TABLE    = robot_arm.tbl


# ─── Computed motor constants ─────────────────────────────────────────────────
# 28BYJ-48 in half-step mode, gear ratio 1:1
#   Steps/rev         = 4096
#   SCALE (steps/deg) = 4096 / 360 = 11.3778
#   MAX_VELOCITY      = 500 SPS / 11.3778 = 43.95 deg/s
#   MAX_ACCELERATION  = 1000 SPS²/ 11.3778 = 87.89 deg/s²
#   Home speed        = 5 SPS   / 11.3778 = 0.44  deg/s
#   Home backup       = 5 steps / 11.3778 = 0.44  deg

# ─── Joint 0: Base yaw ───────────────────────────────────────────────────────
[JOINT_0]
TYPE                = ANGULAR
MAX_VELOCITY        = 43.95
MAX_ACCELERATION    = 87.89
BACKLASH            = 0
SCALE               = 11.3778
MIN_LIMIT           = -170.0
MAX_LIMIT           =  170.0
FERROR              = 5.0
MIN_FERROR          = 2.0
HOME                =   0.0
HOME_OFFSET         = -360.0     # zero_offset_deg from arm_config.json
HOME_SEARCH_VEL     =   0.44
HOME_LATCH_VEL      =   0.22
HOME_USE_INDEX      = NO
HOME_IGNORE_LIMITS  = NO
HOME_SEQUENCE       = 0
# Pico GP pin 20 — NO (normally open) switch, polarity from homing_config
HOME_IS_SHARED      = 0


# ─── Joint 1: Shoulder pitch ─────────────────────────────────────────────────
[JOINT_1]
TYPE                = ANGULAR
MAX_VELOCITY        = 43.95
MAX_ACCELERATION    = 87.89
BACKLASH            = 0
SCALE               = 11.3778
MIN_LIMIT           = -170.0
MAX_LIMIT           =  170.0
FERROR              = 5.0
MIN_FERROR          = 2.0
HOME                =  0.0
HOME_OFFSET         = 90.0      # zero_offset_deg from arm_config.json
HOME_SEARCH_VEL     =  0.44
HOME_LATCH_VEL      =  0.22
HOME_USE_INDEX      = NO
HOME_IGNORE_LIMITS  = NO
HOME_SEQUENCE       = 1
# Pico GP pin 21 — NO switch


# ─── Joint 2: Elbow pitch ────────────────────────────────────────────────────
[JOINT_2]
TYPE                = ANGULAR
MAX_VELOCITY        = 43.95
MAX_ACCELERATION    = 87.89
BACKLASH            = 0
SCALE               = 11.3778
MIN_LIMIT           = -170.0
MAX_LIMIT           =  170.0
FERROR              = 5.0
MIN_FERROR          = 2.0
HOME                =  0.0
HOME_OFFSET         =  0.0
HOME_SEARCH_VEL     =  0.44
HOME_LATCH_VEL      =  0.22
HOME_USE_INDEX      = NO
HOME_IGNORE_LIMITS  = NO
HOME_SEQUENCE       = 2
# Pico GP pin 22 — NO switch


# ─── Joint 3: Wrist roll (coupled follower) ──────────────────────────────────
# Mechanical coupling in Pico firmware: physical J3 steps = J2 steps + offset(−90°).
# LinuxCNC commands J3 freely; the firmware applies the offset to the motor.
[JOINT_3]
TYPE                = ANGULAR
MAX_VELOCITY        = 43.95
MAX_ACCELERATION    = 87.89
BACKLASH            = 0
SCALE               = 11.3778
MIN_LIMIT           = -170.0
MAX_LIMIT           =  170.0
FERROR              = 5.0
MIN_FERROR          = 2.0
HOME                =   0.0
HOME_OFFSET         = -90.0     # zero_offset_deg from arm_config.json
HOME_SEARCH_VEL     =   0.44
HOME_LATCH_VEL      =   0.22
HOME_USE_INDEX      = NO
HOME_IGNORE_LIMITS  = NO
HOME_SEQUENCE       = 3
# Pico GP pin 23 — NO switch


# ─── Joint 4: Wrist pitch ────────────────────────────────────────────────────
[JOINT_4]
TYPE                = ANGULAR
MAX_VELOCITY        = 43.95
MAX_ACCELERATION    = 87.89
BACKLASH            = 0
SCALE               = 11.3778
MIN_LIMIT           = -170.0
MAX_LIMIT           =  170.0
FERROR              = 5.0
MIN_FERROR          = 2.0
HOME                =   0.0
HOME_OFFSET         =  -8.7     # zero_offset_deg from arm_config.json
HOME_SEARCH_VEL     =   0.44
HOME_LATCH_VEL      =   0.22
HOME_USE_INDEX      = NO
HOME_IGNORE_LIMITS  = NO
HOME_SEQUENCE       = 4
# Pico GP pin 24 — NO switch
